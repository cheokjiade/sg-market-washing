name: Fetch NEA Market Data

on:
  schedule:
    # Runs daily at 6:00 AM SGT (10:00 PM UTC previous day)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch closure data from data.gov.sg
        run: |
          echo "Fetching NEA hawker centre closure data..."

          API_URL="https://data.gov.sg/api/action/datastore_search"
          DATASET="d_bda4baa634dd1cc7a6c7cad5f19e2d68"
          LIMIT=500
          OFFSET=0

          # Use temp files instead of shell variables to avoid "Argument list too long"
          echo '[]' > /tmp/all_records.json

          while true; do
            echo "Fetching offset=$OFFSET..."
            URL="${API_URL}?resource_id=${DATASET}&limit=${LIMIT}&offset=${OFFSET}"

            # Retry up to 3 times with backoff
            SUCCESS=false
            for ATTEMPT in 1 2 3; do
              echo "  Attempt $ATTEMPT..."
              HTTP_CODE=$(curl -s -o /tmp/api_response.json -w "%{http_code}" --max-time 30 "$URL") || true

              if [ "$HTTP_CODE" = "200" ]; then
                SUCCESS=true
                break
              fi
              echo "  HTTP $HTTP_CODE - response: $(head -c 300 /tmp/api_response.json 2>/dev/null)"
              WAIT=$((ATTEMPT * 5))
              echo "  Retrying in ${WAIT}s..."
              sleep $WAIT
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: Failed to fetch offset=$OFFSET after 3 attempts"
              exit 1
            fi

            # Validate JSON
            if ! jq empty /tmp/api_response.json 2>/dev/null; then
              echo "ERROR: Invalid JSON response"
              head -c 500 /tmp/api_response.json
              exit 1
            fi

            # Extract records to a temp file
            jq '.result.records // []' /tmp/api_response.json > /tmp/page_records.json
            COUNT=$(jq 'length' /tmp/page_records.json)
            TOTAL=$(jq '.result.total // 0' /tmp/api_response.json)

            echo "  Got $COUNT records (total: $TOTAL)"

            if [ "$COUNT" -eq 0 ] && [ "$OFFSET" -eq 0 ]; then
              echo "ERROR: API returned 0 records on first page"
              head -c 1000 /tmp/api_response.json
              exit 1
            fi

            # Merge records using files, not shell variables
            jq -s '.[0] + .[1]' /tmp/all_records.json /tmp/page_records.json > /tmp/merged.json
            mv /tmp/merged.json /tmp/all_records.json

            OFFSET=$((OFFSET + LIMIT))
            if [ "$COUNT" -eq 0 ] || [ "$OFFSET" -ge "$TOTAL" ]; then
              break
            fi
          done

          FINAL_COUNT=$(jq 'length' /tmp/all_records.json)
          echo "Total records fetched: $FINAL_COUNT"

          if [ "$FINAL_COUNT" -eq 0 ]; then
            echo "ERROR: No records fetched"
            exit 1
          fi

          mkdir -p data
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson total "$FINAL_COUNT" \
            --slurpfile records /tmp/all_records.json \
            '{
              fetched_at: $ts,
              total: $total,
              records: $records[0]
            }' > data/closures.json

          FILE_SIZE=$(wc -c < data/closures.json)
          echo "Saved to data/closures.json ($FILE_SIZE bytes, $FINAL_COUNT records)"

      - name: Check for changes
        id: changes
        run: |
          # Compare against the committed version with fetched_at stripped,
          # so a run where only the timestamp changed doesn't create a commit
          if git show HEAD:data/closures.json > /tmp/old_closures.json 2>/dev/null; then
            jq -S 'del(.fetched_at)' /tmp/old_closures.json > /tmp/old_cmp.json
            jq -S 'del(.fetched_at)' data/closures.json > /tmp/new_cmp.json
            if cmp -s /tmp/old_cmp.json /tmp/new_cmp.json; then
              echo "Market data unchanged (only fetched_at differs) - skipping commit"
              git checkout -- data/closures.json
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Market data changed"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "data/closures.json not yet committed - first fetch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/closures.json

          RECORD_COUNT=$(jq '.total' data/closures.json)
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: update closure data ($DATE, $RECORD_COUNT records)"
          git push
