name: Fetch NEA Market Data

on:
  schedule:
    # Runs daily at 6:00 AM SGT (10:00 PM UTC previous day)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch closure data from data.gov.sg
        run: |
          echo "Fetching NEA hawker centre closure data..."

          API_URL="https://data.gov.sg/api/action/datastore_search"
          DATASET="d_bda4baa634dd1cc7a6c7cad5f19e2d68"
          LIMIT=500
          OFFSET=0
          ALL_RECORDS="[]"

          while true; do
            echo "Fetching offset=$OFFSET..."
            URL="${API_URL}?resource_id=${DATASET}&limit=${LIMIT}&offset=${OFFSET}"

            # Retry up to 3 times with backoff
            SUCCESS=false
            for ATTEMPT in 1 2 3; do
              echo "  Attempt $ATTEMPT..."
              HTTP_CODE=$(curl -s -o /tmp/api_response.json -w "%{http_code}" --max-time 30 "$URL") || true

              if [ "$HTTP_CODE" = "200" ]; then
                SUCCESS=true
                break
              fi
              echo "  HTTP $HTTP_CODE - response: $(head -c 300 /tmp/api_response.json 2>/dev/null)"
              WAIT=$((ATTEMPT * 5))
              echo "  Retrying in ${WAIT}s..."
              sleep $WAIT
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: Failed to fetch offset=$OFFSET after 3 attempts"
              exit 1
            fi

            RESPONSE=$(cat /tmp/api_response.json)

            # Validate JSON
            if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
              echo "ERROR: Invalid JSON response"
              echo "Response (first 500 chars): $(echo "$RESPONSE" | head -c 500)"
              exit 1
            fi

            RECORDS=$(echo "$RESPONSE" | jq '.result.records // []')
            COUNT=$(echo "$RECORDS" | jq 'length')
            TOTAL=$(echo "$RESPONSE" | jq '.result.total // 0')

            echo "  Got $COUNT records (total: $TOTAL)"

            if [ "$COUNT" -eq 0 ] && [ "$OFFSET" -eq 0 ]; then
              echo "ERROR: API returned 0 records on first page"
              echo "Full response: $(echo "$RESPONSE" | head -c 1000)"
              exit 1
            fi

            ALL_RECORDS=$(echo "$ALL_RECORDS $RECORDS" | jq -s '.[0] + .[1]')

            OFFSET=$((OFFSET + LIMIT))
            if [ "$COUNT" -eq 0 ] || [ "$OFFSET" -ge "$TOTAL" ]; then
              break
            fi
          done

          FINAL_COUNT=$(echo "$ALL_RECORDS" | jq 'length')
          echo "Total records fetched: $FINAL_COUNT"

          if [ "$FINAL_COUNT" -eq 0 ]; then
            echo "ERROR: No records fetched"
            exit 1
          fi

          mkdir -p data
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson total "$FINAL_COUNT" \
            --argjson records "$ALL_RECORDS" \
            '{
              fetched_at: $ts,
              total: $total,
              records: $records
            }' > data/closures.json

          FILE_SIZE=$(wc -c < data/closures.json)
          echo "Saved to data/closures.json ($FILE_SIZE bytes, $FINAL_COUNT records)"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/closures.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/closures.json

          RECORD_COUNT=$(jq '.total' data/closures.json)
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: update closure data ($DATE, $RECORD_COUNT records)"
          git push
