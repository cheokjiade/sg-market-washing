<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Market Status Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, #e53935, #d32f2f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        header h1 { font-size: 1.8em; margin-bottom: 6px; }
        header p { opacity: 0.9; font-size: 0.95em; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #e53935; color: #e53935; }
        .tab.active { background: #e53935; color: white; border-color: #e53935; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .search-box input, .search-box select {
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-box button {
            padding: 10px 24px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .search-box button:hover { background: #c62828; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #e53935;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .card.cleaning { border-left-color: #fb8c00; }
        .card.other_works { border-left-color: #7b1fa2; }
        .card-photo {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #eee;
        }
        .card-body { flex: 1; min-width: 0; }
        .card h3 { font-size: 1.1em; margin-bottom: 8px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        .badge.cleaning { background: #fb8c00; }
        .badge.other_works { background: #7b1fa2; }
        .date-range { color: #666; font-size: 0.9em; margin-top: 4px; }
        .remarks { color: #888; font-size: 0.85em; margin-top: 4px; font-style: italic; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 30px; color: #666; }
        .error { text-align: center; padding: 30px; color: #c62828; }
        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.85em;
        }
        footer a { color: #e53935; text-decoration: none; }
        #map { height: 500px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            line-height: 1.8;
            font-size: 0.9em;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        /* Calendar */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .cal-header h2 { font-size: 1.2em; }
        .cal-nav {
            background: none;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }
        .cal-nav:hover { border-color: #e53935; color: #e53935; }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .cal-dow {
            text-align: center;
            font-size: 0.8em;
            font-weight: 600;
            color: #999;
            padding: 6px 0;
        }
        .cal-day {
            min-height: 80px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 4px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.15s;
            overflow: hidden;
        }
        .cal-day:hover { background: #fafafa; }
        .cal-day.today { border-color: #e53935; border-width: 2px; }
        .cal-day.selected { background: #fce4ec; }
        .cal-day.other-month { opacity: 0.35; }
        .cal-day-num { font-weight: 600; margin-bottom: 2px; padding: 2px 4px; }
        .cal-event {
            display: block;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.72em;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
            line-height: 1.5;
        }
        .cal-event.cleaning { background: #fb8c00; }
        .cal-event.other_works { background: #7b1fa2; }
        .cal-more {
            font-size: 0.7em;
            color: #999;
            padding: 0 4px;
        }
        .cal-detail {
            margin-top: 16px;
        }
        .cal-detail-header {
            background: white;
            padding: 14px 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: 600;
            border-bottom: 2px solid #e53935;
        }
        @media (max-width: 600px) {
            .cal-day { min-height: 50px; }
            .cal-event { font-size: 0.6em; padding: 1px 3px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SG Market Status Checker</h1>
            <p>Check which Singapore hawker centres &amp; markets are closed for washing or renovation</p>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('today', this)">Closed Today</div>
            <div class="tab" onclick="switchTab('upcoming', this)">Upcoming Closures</div>
            <div class="tab" onclick="switchTab('search', this)">Search Market</div>
            <div class="tab" onclick="switchTab('date', this)">Calendar</div>
            <div class="tab" onclick="switchTab('map', this)">Map View</div>
        </div>

        <div id="panel-today" class="panel">
            <div id="today-results" class="loading">Loading...</div>
        </div>

        <div id="panel-upcoming" class="panel" style="display:none">
            <div class="search-box">
                <label>Days ahead: </label>
                <select id="upcoming-days" onchange="showUpcoming()">
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30" selected>30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                </select>
            </div>
            <div id="upcoming-results" class="loading">Loading...</div>
        </div>

        <div id="panel-search" class="panel" style="display:none">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter market or hawker centre name..."
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">Search</button>
            </div>
            <div id="search-results"></div>
        </div>

        <div id="panel-date" class="panel" style="display:none">
            <div class="cal-header">
                <button class="cal-nav" onclick="calNav(-1)">&larr; Prev</button>
                <h2 id="cal-title"></h2>
                <button class="cal-nav" onclick="calNav(1)">Next &rarr;</button>
            </div>
            <div id="cal-grid" class="cal-grid"></div>
            <div class="cal-detail" id="cal-detail"></div>
        </div>

        <div id="panel-map" class="panel" style="display:none">
            <div id="map"></div>
        </div>

        <footer>
            Data from <a href="https://data.gov.sg" target="_blank">data.gov.sg</a> (NEA)
        </footer>
    </div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const CLOSURE_DATASET = 'd_bda4baa634dd1cc7a6c7cad5f19e2d68';
const DS_URL = 'https://data.gov.sg/api/action/datastore_search';

// ── Data cache ──────────────────────────────────────────────────────
let closureCache = null;

// ── Date helpers ────────────────────────────────────────────────────
function today() {
    return new Date().toISOString().slice(0, 10);
}

function parseDate(s) {
    if (!s || typeof s !== 'string') return null;
    s = s.trim();
    if (s === 'NA' || s === 'nil' || s === 'TBC') return null;
    // YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    // D/M/YYYY or DD/MM/YYYY (with / or -)
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
}

function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

// ── Fetch closure data (paginated, with JSONP fallback) ─────────────
function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cb = '_cb' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        window[cb] = function (data) {
            delete window[cb];
            document.head.removeChild(script);
            resolve(data);
        };
        script.onerror = function () {
            delete window[cb];
            document.head.removeChild(script);
            reject(new Error('JSONP request failed'));
        };
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
        document.head.appendChild(script);
    });
}

async function fetchPage(offset) {
    const url = `${DS_URL}?resource_id=${CLOSURE_DATASET}&limit=500&offset=${offset}`;
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    } catch (e) {
        console.log('fetch failed, trying JSONP...', e.message);
        return await jsonp(url);
    }
}

async function fetchAllClosures() {
    if (closureCache) return closureCache;
    let all = [], offset = 0, total = Infinity;
    while (offset < total) {
        const json = await fetchPage(offset);
        const result = json.result || {};
        total = result.total || 0;
        const records = result.records || [];
        all = all.concat(records);
        offset += 500;
        if (records.length === 0) break;
    }
    if (all.length > 0) {
        console.log('Loaded ' + all.length + ' closure records');
        console.log('Column names:', Object.keys(all[0]));
    }
    closureCache = all;
    return all;
}

// ── Field access helpers ────────────────────────────────────────────
// Use the exact column names from the dataset:
//   name, q1_cleaningstartdate, q1_cleaningenddate, remarks_q1,
//   q2_cleaningstartdate, q2_cleaningenddate, remarks_q2, ...
//   q4_cleaningstartdate, q4_cleaningenddate, remarks_q4,
//   other_works_startdate, other_works_enddate, remarks_other_works,
//   latitude_hc, longitude_hc, address_myenv

function getName(rec) {
    return rec.name || rec.Name || rec.name_of_centre || 'Unknown';
}

function getClosurePeriods(rec) {
    const periods = [];
    for (let q = 1; q <= 4; q++) {
        const s = parseDate(rec[`q${q}_cleaningstartdate`]);
        const e = parseDate(rec[`q${q}_cleaningenddate`]);
        if (s && e) periods.push({ type: 'cleaning', start: s, end: e, remarks: rec[`remarks_q${q}`] || '' });
    }
    const ws = parseDate(rec.other_works_startdate);
    const we = parseDate(rec.other_works_enddate);
    if (ws && we) periods.push({ type: 'other_works', start: ws, end: we, remarks: rec.remarks_other_works || '' });
    return periods;
}

function getPhoto(rec) {
    const url = rec.photourl || rec.photo_url || '';
    if (!url || url === 'nil' || url === 'NA') return '';
    // Ensure https
    return url.replace(/^http:/, 'https:');
}

function getLatLng(rec) {
    const lat = parseFloat(rec.latitude_hc);
    const lng = parseFloat(rec.longitude_hc);
    if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) return { lat, lng };
    return null;
}

// ── Core: get closures on a date ────────────────────────────────────
async function getClosuresOnDate(targetStr) {
    const target = parseDate(targetStr) || new Date();
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= target && target <= p.end) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: p.remarks,
                    photourl: getPhoto(rec),
                });
                break;
            }
        }
    }
    return results;
}

// ── Core: upcoming closures ─────────────────────────────────────────
async function getUpcomingClosures(daysAhead) {
    const target = new Date();
    const end = addDays(target, daysAhead);
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= end && p.end >= target) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: p.remarks,
                    photourl: getPhoto(rec),
                });
            }
        }
    }
    results.sort((a, b) => a.start_date.localeCompare(b.start_date));
    return results;
}

// ── Core: search by name ────────────────────────────────────────────
async function searchMarket(query) {
    const q = query.toLowerCase();
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        if (!name.toLowerCase().includes(q)) continue;
        const closures = getClosurePeriods(rec).map(p => ({
            type: p.type,
            start_date: toISO(p.start),
            end_date: toISO(p.end),
        }));
        results.push({ name, closures, remarks: rec.remarks_other_works || '', photourl: getPhoto(rec) });
    }
    return results;
}

// ── Core: map data (uses latitude_hc / longitude_hc from dataset) ───
async function getMapData() {
    const target = new Date();
    const weekAhead = addDays(target, 7);
    const records = await fetchAllClosures();

    const colourMap = { closed: 'red', closing_soon: 'yellow', open: 'green' };
    const markers = [];

    for (const rec of records) {
        const name = getName(rec);
        const loc = getLatLng(rec);
        if (!loc) continue;

        let status = 'open', closure_info = '';
        for (const p of getClosurePeriods(rec)) {
            const label = p.type === 'cleaning' ? 'Cleaning/Washing' : 'Renovation/Other Works';
            const info = `${label}: ${toISO(p.start)} to ${toISO(p.end)}`;
            if (p.start <= target && target <= p.end) {
                status = 'closed'; closure_info = info; break;
            } else if (target < p.start && p.start <= weekAhead && status !== 'closed') {
                status = 'closing_soon'; closure_info = info;
            }
        }

        markers.push({
            name, lat: loc.lat, lng: loc.lng, status,
            colour: colourMap[status], closure_info,
            address: rec.address_myenv || '',
            photourl: getPhoto(rec),
            food_stalls: rec.no_of_food_stalls || '',
            market_stalls: rec.no_of_market_stalls || '',
            google_3d: rec.google_3d_view || '',
        });
    }
    return markers;
}

// ── UI rendering ────────────────────────────────────────────────────
function renderClosures(closures, containerId) {
    const el = document.getElementById(containerId);
    if (!closures.length) {
        el.innerHTML = '<div class="empty">No closures found for this date.</div>';
        return;
    }
    el.innerHTML = closures.map(c => {
        const typeLabel = c.closure_type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
        const photo = c.photourl
            ? `<img class="card-photo" src="${esc(c.photourl)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none'">`
            : '';
        return `<div class="card ${c.closure_type}">
            ${photo}
            <div class="card-body">
                <h3>${esc(c.name)}</h3>
                <span class="badge ${c.closure_type}">${typeLabel}</span>
                <div class="date-range">${c.start_date} to ${c.end_date}</div>
                ${c.remarks ? '<div class="remarks">' + esc(c.remarks) + '</div>' : ''}
            </div>
        </div>`;
    }).join('');
}

function renderSearchResults(results, containerId) {
    const el = document.getElementById(containerId);
    if (!results.length) {
        el.innerHTML = '<div class="empty">No markets found.</div>';
        return;
    }
    el.innerHTML = results.map(r => {
        const closureHtml = r.closures.length
            ? r.closures.map(c => {
                const label = c.type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
                return `<div style="margin-top:6px"><span class="badge ${c.type}">${label}</span>
                        <span class="date-range">${c.start_date} to ${c.end_date}</span></div>`;
            }).join('')
            : '<div style="margin-top:6px;color:#999">No scheduled closures found.</div>';
        const photo = r.photourl
            ? `<img class="card-photo" src="${esc(r.photourl)}" alt="${esc(r.name)}" loading="lazy" onerror="this.style.display='none'">`
            : '';
        return `<div class="card">
            ${photo}
            <div class="card-body">
                <h3>${esc(r.name)}</h3>
                ${r.remarks ? '<div class="remarks">' + esc(r.remarks) + '</div>' : ''}
                ${closureHtml}
            </div>
        </div>`;
    }).join('');
}

function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ── Tab switching ───────────────────────────────────────────────────
function switchTab(tab, tabEl) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    tabEl.classList.add('active');
    document.getElementById('panel-' + tab).style.display = 'block';

    if (tab === 'today') showToday();
    if (tab === 'upcoming') showUpcoming();
    if (tab === 'date') renderCalendar();
    if (tab === 'map') showMap();
}

// ── Tab actions ─────────────────────────────────────────────────────
async function showToday() {
    const el = document.getElementById('today-results');
    el.innerHTML = '<div class="loading">Loading from data.gov.sg...</div>';
    try {
        const closures = await getClosuresOnDate(today());
        renderClosures(closures, 'today-results');
    } catch (e) {
        console.error('showToday error:', e);
        el.innerHTML = '<div class="error">Failed to load data: ' + esc(e.message) +
            '<br><small>Check browser console (F12) for details. The data.gov.sg API may not support CORS from this origin.</small></div>';
    }
}

async function showUpcoming() {
    const el = document.getElementById('upcoming-results');
    el.innerHTML = '<div class="loading">Loading from data.gov.sg...</div>';
    try {
        const days = parseInt(document.getElementById('upcoming-days').value);
        const closures = await getUpcomingClosures(days);
        renderClosures(closures, 'upcoming-results');
    } catch (e) {
        console.error('showUpcoming error:', e);
        el.innerHTML = '<div class="error">Failed to load data: ' + esc(e.message) + '</div>';
    }
}

async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    const el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading">Searching...</div>';
    try {
        const results = await searchMarket(q);
        renderSearchResults(results, 'search-results');
    } catch (e) {
        console.error('doSearch error:', e);
        el.innerHTML = '<div class="error">Search failed: ' + esc(e.message) + '</div>';
    }
}

// ── Calendar ─────────────────────────────────────────────────────────
let calYear, calMonth; // 0-indexed month
let calClosureData = null; // cached: Map<"YYYY-MM-DD", [{name, type, start, end, remarks, photourl}]>

function calInit() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
}
calInit();

function calNav(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
}

async function buildCalClosureData() {
    if (calClosureData) return calClosureData;
    const records = await fetchAllClosures();
    const map = new Map();

    for (const rec of records) {
        const name = getName(rec);
        const photourl = getPhoto(rec);
        for (const p of getClosurePeriods(rec)) {
            // Iterate each day in the closure range
            const d = new Date(p.start);
            while (d <= p.end) {
                const key = toISO(d);
                if (!map.has(key)) map.set(key, []);
                map.get(key).push({
                    name, type: p.type,
                    start_date: toISO(p.start), end_date: toISO(p.end),
                    remarks: p.remarks, photourl,
                });
                d.setDate(d.getDate() + 1);
            }
        }
    }
    calClosureData = map;
    return map;
}

async function renderCalendar() {
    const titleEl = document.getElementById('cal-title');
    const gridEl = document.getElementById('cal-grid');
    const detailEl = document.getElementById('cal-detail');
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    titleEl.textContent = monthNames[calMonth] + ' ' + calYear;
    gridEl.innerHTML = '<div class="loading" style="grid-column:1/-1">Loading closures...</div>';
    detailEl.innerHTML = '';

    const data = await buildCalClosureData();

    const todayStr = today();
    const firstDay = new Date(calYear, calMonth, 1);
    const startDow = firstDay.getDay(); // 0=Sun
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    // Build grid
    let html = '';
    const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (const d of dows) html += `<div class="cal-dow">${d}</div>`;

    // Previous month fill
    const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
    for (let i = startDow - 1; i >= 0; i--) {
        const day = prevMonthDays - i;
        const dt = new Date(calYear, calMonth - 1, day);
        const key = toISO(dt);
        html += buildCalDay(day, key, data, todayStr, true);
    }

    // Current month
    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += buildCalDay(d, key, data, todayStr, false);
    }

    // Next month fill (complete the last row)
    const totalCells = startDow + daysInMonth;
    const remainder = totalCells % 7;
    if (remainder > 0) {
        for (let d = 1; d <= 7 - remainder; d++) {
            const dt = new Date(calYear, calMonth + 1, d);
            const key = toISO(dt);
            html += buildCalDay(d, key, data, todayStr, true);
        }
    }

    gridEl.innerHTML = html;
}

function buildCalDay(dayNum, dateKey, data, todayStr, isOtherMonth) {
    const events = data.get(dateKey) || [];
    const classes = ['cal-day'];
    if (dateKey === todayStr) classes.push('today');
    if (isOtherMonth) classes.push('other-month');

    const maxShow = 2;
    let evHtml = '';
    for (let i = 0; i < Math.min(events.length, maxShow); i++) {
        const e = events[i];
        evHtml += `<span class="cal-event ${e.type}">${esc(e.name)}</span>`;
    }
    if (events.length > maxShow) {
        evHtml += `<span class="cal-more">+${events.length - maxShow} more</span>`;
    }

    return `<div class="${classes.join(' ')}" onclick="calSelectDay('${dateKey}')">
        <div class="cal-day-num">${dayNum}</div>
        ${evHtml}
    </div>`;
}

async function calSelectDay(dateKey) {
    // Highlight selected day
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    const allDays = document.querySelectorAll('.cal-day');
    for (const el of allDays) {
        if (el.onclick && el.getAttribute('onclick')?.includes(dateKey)) {
            el.classList.add('selected');
        }
    }

    const data = await buildCalClosureData();
    const events = data.get(dateKey) || [];
    const detailEl = document.getElementById('cal-detail');

    const d = parseDate(dateKey);
    const dateLabel = d ? d.toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : dateKey;

    if (!events.length) {
        detailEl.innerHTML = `<div class="cal-detail-header">${esc(dateLabel)}</div>
            <div class="empty">No closures on this date.</div>`;
        return;
    }

    // Deduplicate (same market may appear if multiple closure periods overlap, but shouldn't on same day)
    const closures = events.map(e => ({
        name: e.name,
        closure_type: e.type,
        start_date: e.start_date,
        end_date: e.end_date,
        remarks: e.remarks,
        photourl: e.photourl,
    }));

    detailEl.innerHTML = `<div class="cal-detail-header">${esc(dateLabel)} &mdash; ${closures.length} closure${closures.length > 1 ? 's' : ''}</div>`;
    // Reuse the existing renderClosures into a temp container
    const tempId = 'cal-detail-list';
    detailEl.innerHTML += `<div id="${tempId}"></div>`;
    renderClosures(closures, tempId);
}

// ── Map ─────────────────────────────────────────────────────────────
let mapInstance = null;
let mapLoaded = false;

async function showMap() {
    if (mapLoaded) {
        mapInstance.invalidateSize();
        return;
    }

    const mapEl = document.getElementById('map');
    mapEl.innerHTML = '';

    mapInstance = L.map('map').setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(mapInstance);

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML =
            '<strong>Status</strong><br>' +
            '<span class="legend-dot" style="background:#d32f2f"></span> Closed today<br>' +
            '<span class="legend-dot" style="background:#f9a825"></span> Closing within 7 days<br>' +
            '<span class="legend-dot" style="background:#388e3c"></span> Open';
        return div;
    };
    legend.addTo(mapInstance);

    const colourHex = { red: '#d32f2f', yellow: '#f9a825', green: '#388e3c' };

    try {
        const markers = await getMapData();

        for (const m of markers) {
            const colour = colourHex[m.colour] || '#388e3c';
            const circle = L.circleMarker([m.lat, m.lng], {
                radius: 8,
                fillColor: colour,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9,
            }).addTo(mapInstance);

            let popup = '';
            if (m.photourl) popup += '<img src="' + esc(m.photourl) + '" style="width:200px;height:120px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block" onerror="this.style.display=\'none\'">';
            popup += '<strong>' + esc(m.name) + '</strong>';
            if (m.address) popup += '<br>' + esc(m.address);
            if (m.status === 'closed') {
                popup += '<br><span style="color:#d32f2f;font-weight:600">CLOSED</span>';
            } else if (m.status === 'closing_soon') {
                popup += '<br><span style="color:#f9a825;font-weight:600">CLOSING SOON</span>';
            } else {
                popup += '<br><span style="color:#388e3c;font-weight:600">OPEN</span>';
            }
            if (m.closure_info) popup += '<br><em>' + esc(m.closure_info) + '</em>';
            const stalls = [];
            if (m.food_stalls && m.food_stalls !== 'nil') stalls.push(m.food_stalls + ' food stalls');
            if (m.market_stalls && m.market_stalls !== 'nil') stalls.push(m.market_stalls + ' market stalls');
            if (stalls.length) popup += '<br><span style="color:#555;font-size:0.85em">' + esc(stalls.join(' · ')) + '</span>';
            if (m.google_3d && m.google_3d !== 'nil') popup += '<br><a href="' + esc(m.google_3d) + '" target="_blank" rel="noopener" style="font-size:0.85em">View in Google 3D</a>';
            circle.bindPopup(popup, { maxWidth: 250 });
        }
        console.log('Map loaded with ' + markers.length + ' markers');
    } catch (e) {
        console.error('Map error:', e);
    }

    mapLoaded = true;
}

// ── Init ────────────────────────────────────────────────────────────
showToday();
