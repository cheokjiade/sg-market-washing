<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Market Status Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, #e53935, #d32f2f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        header h1 { font-size: 1.8em; margin-bottom: 6px; }
        header p { opacity: 0.9; font-size: 0.95em; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #e53935; color: #e53935; }
        .tab.active { background: #e53935; color: white; border-color: #e53935; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .search-box input, .search-box select {
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-box button {
            padding: 10px 24px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .search-box button:hover { background: #c62828; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #e53935;
        }
        .card.cleaning { border-left-color: #fb8c00; }
        .card.other_works { border-left-color: #7b1fa2; }
        .card h3 { font-size: 1.1em; margin-bottom: 8px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        .badge.cleaning { background: #fb8c00; }
        .badge.other_works { background: #7b1fa2; }
        .date-range { color: #666; font-size: 0.9em; margin-top: 4px; }
        .remarks { color: #888; font-size: 0.85em; margin-top: 4px; font-style: italic; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 30px; color: #666; }
        .error { text-align: center; padding: 30px; color: #c62828; }
        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.85em;
        }
        footer a { color: #e53935; text-decoration: none; }
        #map { height: 500px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            line-height: 1.8;
            font-size: 0.9em;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SG Market Status Checker</h1>
            <p>Check which Singapore hawker centres &amp; markets are closed for washing or renovation</p>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('today', this)">Closed Today</div>
            <div class="tab" onclick="switchTab('upcoming', this)">Upcoming Closures</div>
            <div class="tab" onclick="switchTab('search', this)">Search Market</div>
            <div class="tab" onclick="switchTab('date', this)">Check Date</div>
            <div class="tab" onclick="switchTab('map', this)">Map View</div>
        </div>

        <div id="panel-today" class="panel">
            <div id="today-results" class="loading">Loading...</div>
        </div>

        <div id="panel-upcoming" class="panel" style="display:none">
            <div class="search-box">
                <label>Days ahead: </label>
                <select id="upcoming-days" onchange="showUpcoming()">
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30" selected>30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                </select>
            </div>
            <div id="upcoming-results" class="loading">Loading...</div>
        </div>

        <div id="panel-search" class="panel" style="display:none">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter market or hawker centre name..."
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">Search</button>
            </div>
            <div id="search-results"></div>
        </div>

        <div id="panel-date" class="panel" style="display:none">
            <div class="search-box">
                <input type="date" id="date-input">
                <button onclick="checkDate()">Check</button>
            </div>
            <div id="date-results"></div>
        </div>

        <div id="panel-map" class="panel" style="display:none">
            <div id="map"></div>
        </div>

        <footer>
            Data from <a href="https://data.gov.sg" target="_blank">data.gov.sg</a> (NEA)
        </footer>
    </div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const CLOSURE_DATASET = 'd_bda4baa634dd1cc7a6c7cad5f19e2d68';
const DS_URL = 'https://data.gov.sg/api/action/datastore_search';
const ONEMAP_SEARCH = 'https://www.onemap.gov.sg/api/common/elastic/search';

// ── Data cache ──────────────────────────────────────────────────────
let closureCache = null;
let geocodeCache = {};

// ── Date helpers ────────────────────────────────────────────────────
function today() {
    return new Date().toISOString().slice(0, 10);
}

function parseDate(s) {
    if (!s || typeof s !== 'string') return null;
    s = s.trim();
    // YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    // DD/MM/YYYY or DD-MM-YYYY
    m = s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
}

function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

// ── Fetch closure data (paginated, with JSONP fallback) ─────────────
function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cb = '_cb' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        window[cb] = function (data) {
            delete window[cb];
            document.head.removeChild(script);
            resolve(data);
        };
        script.onerror = function () {
            delete window[cb];
            document.head.removeChild(script);
            reject(new Error('JSONP request failed'));
        };
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
        document.head.appendChild(script);
    });
}

async function fetchPage(offset) {
    const url = `${DS_URL}?resource_id=${CLOSURE_DATASET}&limit=500&offset=${offset}`;
    // Try fetch first, fall back to JSONP
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    } catch (e) {
        console.log('fetch failed, trying JSONP...', e.message);
        return await jsonp(url);
    }
}

async function fetchAllClosures() {
    if (closureCache) return closureCache;
    let all = [], offset = 0, total = Infinity;
    while (offset < total) {
        const json = await fetchPage(offset);
        const result = json.result || {};
        total = result.total || 0;
        const records = result.records || [];
        all = all.concat(records);
        offset += 500;
        if (records.length === 0) break;
    }
    if (all.length > 0) {
        console.log('Loaded ' + all.length + ' closure records');
        console.log('Column names:', Object.keys(all[0]));
        console.log('Sample record:', JSON.stringify(all[0], null, 2));
    } else {
        console.warn('No closure records returned from API');
    }
    closureCache = all;
    return all;
}

// ── Smart field detection ───────────────────────────────────────────
// Instead of hardcoding field names, auto-detect from column names.
let fieldMap = null;

function buildFieldMap(record) {
    if (fieldMap) return;
    const keys = Object.keys(record).map(k => k.trim().toLowerCase().replace(/\s+/g, '_'));
    const orig = Object.keys(record);
    fieldMap = { name: null, cleaning: [], other_works: [], remarks: null };

    for (let i = 0; i < keys.length; i++) {
        const k = keys[i], o = orig[i];
        // Name field
        if (!fieldMap.name && (k.includes('name') || k.includes('centre'))) {
            if (!k.includes('date') && !k.includes('start') && !k.includes('end')) {
                fieldMap.name = o;
            }
        }
        // Remarks
        if (!fieldMap.remarks && k.includes('remark')) {
            fieldMap.remarks = o;
        }
        // Cleaning date pairs
        if ((k.includes('cleaning') || k.includes('washing')) && k.includes('start')) {
            const endKey = findEndKey(orig, keys, k, i);
            if (endKey) fieldMap.cleaning.push({ start: o, end: endKey });
        }
        // Other works
        if ((k.includes('other') || k.includes('works') || k.includes('renovation')) && k.includes('start')) {
            const endKey = findEndKey(orig, keys, k, i);
            if (endKey) fieldMap.other_works.push({ start: o, end: endKey });
        }
    }

    // If no cleaning fields found via 'cleaning', look for q1/q2/q3/q4 patterns
    if (fieldMap.cleaning.length === 0) {
        for (let i = 0; i < keys.length; i++) {
            const k = keys[i], o = orig[i];
            if (/q\d/.test(k) && k.includes('start')) {
                const endKey = findEndKey(orig, keys, k, i);
                if (endKey) fieldMap.cleaning.push({ start: o, end: endKey });
            }
        }
    }

    console.log('Auto-detected field map:', JSON.stringify(fieldMap, null, 2));
}

function findEndKey(orig, keys, startKeyNorm, startIdx) {
    // Try to find matching end key by replacing 'start' with 'end'
    const endPattern = startKeyNorm.replace('start', 'end');
    for (let j = 0; j < keys.length; j++) {
        if (keys[j] === endPattern) return orig[j];
    }
    // Try nearby keys
    for (let j = startIdx + 1; j < Math.min(startIdx + 3, keys.length); j++) {
        if (keys[j].includes('end')) return orig[j];
    }
    return null;
}

function getName(record) {
    if (fieldMap && fieldMap.name) return record[fieldMap.name] || 'Unknown';
    // Fallback: try common names
    for (const k of Object.keys(record)) {
        const kl = k.toLowerCase();
        if ((kl.includes('name') || kl.includes('centre')) && !kl.includes('date')) {
            const v = record[k];
            if (v && typeof v === 'string' && v.length > 2) return v;
        }
    }
    return 'Unknown';
}

function getClosurePeriods(record) {
    const periods = [];
    if (!fieldMap) return periods;

    for (const pair of fieldMap.cleaning) {
        const s = parseDate(record[pair.start]);
        const e = parseDate(record[pair.end]);
        if (s && e) periods.push({ type: 'cleaning', start: s, end: e });
    }
    for (const pair of fieldMap.other_works) {
        const s = parseDate(record[pair.start]);
        const e = parseDate(record[pair.end]);
        if (s && e) periods.push({ type: 'other_works', start: s, end: e });
    }
    return periods;
}

function getRemarks(record) {
    if (fieldMap && fieldMap.remarks) return record[fieldMap.remarks] || '';
    return '';
}

// ── Core: get closures on a date ────────────────────────────────────
async function getClosuresOnDate(targetStr) {
    const target = parseDate(targetStr) || new Date();
    const records = await fetchAllClosures();
    if (records.length > 0) buildFieldMap(records[0]);
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= target && target <= p.end) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: getRemarks(rec),
                });
                break;
            }
        }
    }
    return results;
}

// ── Core: upcoming closures ─────────────────────────────────────────
async function getUpcomingClosures(daysAhead) {
    const target = new Date();
    const end = addDays(target, daysAhead);
    const records = await fetchAllClosures();
    if (records.length > 0) buildFieldMap(records[0]);
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= end && p.end >= target) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: getRemarks(rec),
                });
            }
        }
    }
    results.sort((a, b) => a.start_date.localeCompare(b.start_date));
    return results;
}

// ── Core: search by name ────────────────────────────────────────────
async function searchMarket(query) {
    const q = query.toLowerCase();
    const records = await fetchAllClosures();
    if (records.length > 0) buildFieldMap(records[0]);
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        if (!name.toLowerCase().includes(q)) continue;
        const closures = getClosurePeriods(rec).map(p => ({
            type: p.type,
            start_date: toISO(p.start),
            end_date: toISO(p.end),
        }));
        results.push({ name, closures, remarks: getRemarks(rec) });
    }
    return results;
}

// ── Geocode via OneMap ──────────────────────────────────────────────
async function geocode(name) {
    if (geocodeCache[name]) return geocodeCache[name];
    try {
        const url = `${ONEMAP_SEARCH}?searchVal=${encodeURIComponent(name)}&returnGeom=Y&getAddrDetails=Y&pageNum=1`;
        const res = await fetch(url);
        const json = await res.json();
        const results = json.results || [];
        if (results.length > 0) {
            const r = results[0];
            const loc = { lat: parseFloat(r.LATITUDE), lng: parseFloat(r.LONGITUDE), address: r.ADDRESS || '' };
            geocodeCache[name] = loc;
            return loc;
        }
    } catch (e) {
        // Ignore geocoding errors for individual centres
    }
    return null;
}

// ── Core: map data ──────────────────────────────────────────────────
async function getMapData(progressCallback) {
    const target = new Date();
    const weekAhead = addDays(target, 7);
    const records = await fetchAllClosures();
    if (records.length > 0) buildFieldMap(records[0]);

    // Build list of unique centres with their closure status
    const centres = {};
    for (const rec of records) {
        const name = getName(rec);
        if (!name || name === 'Unknown') continue;
        if (!centres[name]) {
            centres[name] = { name, status: 'open', closure_info: '' };
        }
        for (const p of getClosurePeriods(rec)) {
            const label = p.type === 'cleaning' ? 'Cleaning/Washing' : 'Renovation/Other Works';
            const info = `${label}: ${toISO(p.start)} to ${toISO(p.end)}`;
            if (p.start <= target && target <= p.end) {
                centres[name] = { name, status: 'closed', closure_info: info };
                break;
            } else if (target < p.start && p.start <= weekAhead) {
                if (centres[name].status !== 'closed') {
                    centres[name] = { name, status: 'closing_soon', closure_info: info };
                }
            }
        }
    }

    const names = Object.keys(centres);
    const markers = [];
    const colourMap = { closed: 'red', closing_soon: 'yellow', open: 'green' };

    // Geocode in batches of 5 to avoid hammering OneMap
    for (let i = 0; i < names.length; i += 5) {
        const batch = names.slice(i, i + 5);
        const results = await Promise.all(batch.map(n => geocode(n)));
        for (let j = 0; j < batch.length; j++) {
            const loc = results[j];
            if (!loc) continue;
            const c = centres[batch[j]];
            markers.push({
                name: c.name,
                lat: loc.lat,
                lng: loc.lng,
                status: c.status,
                colour: colourMap[c.status],
                closure_info: c.closure_info,
                address: loc.address,
            });
        }
        if (progressCallback) progressCallback(Math.min(i + 5, names.length), names.length);
    }
    return markers;
}

// ── UI rendering ────────────────────────────────────────────────────
function renderClosures(closures, containerId) {
    const el = document.getElementById(containerId);
    if (!closures.length) {
        el.innerHTML = '<div class="empty">No closures found for this date.</div>';
        return;
    }
    el.innerHTML = closures.map(c => {
        const typeLabel = c.closure_type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
        return `<div class="card ${c.closure_type}">
            <h3>${esc(c.name)}</h3>
            <span class="badge ${c.closure_type}">${typeLabel}</span>
            <div class="date-range">${c.start_date} to ${c.end_date}</div>
            ${c.remarks ? '<div class="remarks">' + esc(c.remarks) + '</div>' : ''}
        </div>`;
    }).join('');
}

function renderSearchResults(results, containerId) {
    const el = document.getElementById(containerId);
    if (!results.length) {
        el.innerHTML = '<div class="empty">No markets found.</div>';
        return;
    }
    el.innerHTML = results.map(r => {
        const closureHtml = r.closures.length
            ? r.closures.map(c => {
                const label = c.type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
                return `<div style="margin-top:6px"><span class="badge ${c.type}">${label}</span>
                        <span class="date-range">${c.start_date} to ${c.end_date}</span></div>`;
            }).join('')
            : '<div style="margin-top:6px;color:#999">No scheduled closures found.</div>';
        return `<div class="card">
            <h3>${esc(r.name)}</h3>
            ${r.remarks ? '<div class="remarks">' + esc(r.remarks) + '</div>' : ''}
            ${closureHtml}
        </div>`;
    }).join('');
}

function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ── Tab switching ───────────────────────────────────────────────────
function switchTab(tab, tabEl) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    tabEl.classList.add('active');
    document.getElementById('panel-' + tab).style.display = 'block';

    if (tab === 'today') showToday();
    if (tab === 'upcoming') showUpcoming();
    if (tab === 'map') showMap();
}

// ── Tab actions ─────────────────────────────────────────────────────
async function showToday() {
    const el = document.getElementById('today-results');
    el.innerHTML = '<div class="loading">Loading from data.gov.sg...</div>';
    try {
        const closures = await getClosuresOnDate(today());
        renderClosures(closures, 'today-results');
    } catch (e) {
        console.error('showToday error:', e);
        el.innerHTML = '<div class="error">Failed to load data: ' + esc(e.message) +
            '<br><small>Check browser console (F12) for details. The data.gov.sg API may not support CORS from this origin.</small></div>';
    }
}

async function showUpcoming() {
    const el = document.getElementById('upcoming-results');
    el.innerHTML = '<div class="loading">Loading from data.gov.sg...</div>';
    try {
        const days = parseInt(document.getElementById('upcoming-days').value);
        const closures = await getUpcomingClosures(days);
        renderClosures(closures, 'upcoming-results');
    } catch (e) {
        console.error('showUpcoming error:', e);
        el.innerHTML = '<div class="error">Failed to load data: ' + esc(e.message) + '</div>';
    }
}

async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    const el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading">Searching...</div>';
    try {
        const results = await searchMarket(q);
        renderSearchResults(results, 'search-results');
    } catch (e) {
        console.error('doSearch error:', e);
        el.innerHTML = '<div class="error">Search failed: ' + esc(e.message) + '</div>';
    }
}

async function checkDate() {
    const d = document.getElementById('date-input').value;
    if (!d) return;
    const el = document.getElementById('date-results');
    el.innerHTML = '<div class="loading">Loading...</div>';
    try {
        const closures = await getClosuresOnDate(d);
        renderClosures(closures, 'date-results');
    } catch (e) {
        console.error('checkDate error:', e);
        el.innerHTML = '<div class="error">Failed to load data: ' + esc(e.message) + '</div>';
    }
}

// ── Map ─────────────────────────────────────────────────────────────
let mapInstance = null;
let mapLoaded = false;

async function showMap() {
    if (mapLoaded) {
        mapInstance.invalidateSize();
        return;
    }

    const mapEl = document.getElementById('map');
    mapEl.innerHTML = '';

    mapInstance = L.map('map').setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(mapInstance);

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML =
            '<strong>Status</strong><br>' +
            '<span class="legend-dot" style="background:#d32f2f"></span> Closed today<br>' +
            '<span class="legend-dot" style="background:#f9a825"></span> Closing within 7 days<br>' +
            '<span class="legend-dot" style="background:#388e3c"></span> Open';
        return div;
    };
    legend.addTo(mapInstance);

    // Progress indicator
    const progress = L.control({ position: 'topright' });
    progress.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.id = 'map-progress';
        div.innerHTML = 'Loading markers...';
        return div;
    };
    progress.addTo(mapInstance);

    const colourHex = { red: '#d32f2f', yellow: '#f9a825', green: '#388e3c' };

    try {
        const markers = await getMapData((done, total) => {
            const el = document.getElementById('map-progress');
            if (el) el.innerHTML = `Geocoding ${done}/${total}...`;
        });

        const progressEl = document.getElementById('map-progress');
        if (progressEl) progressEl.parentNode.removeChild(progressEl);

        for (const m of markers) {
            const colour = colourHex[m.colour] || '#388e3c';
            const circle = L.circleMarker([m.lat, m.lng], {
                radius: 8,
                fillColor: colour,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9,
            }).addTo(mapInstance);

            let popup = '<strong>' + esc(m.name) + '</strong>';
            if (m.address) popup += '<br>' + esc(m.address);
            if (m.status === 'closed') {
                popup += '<br><span style="color:#d32f2f;font-weight:600">CLOSED</span>';
            } else if (m.status === 'closing_soon') {
                popup += '<br><span style="color:#f9a825;font-weight:600">CLOSING SOON</span>';
            } else {
                popup += '<br><span style="color:#388e3c;font-weight:600">OPEN</span>';
            }
            if (m.closure_info) popup += '<br><em>' + esc(m.closure_info) + '</em>';
            circle.bindPopup(popup);
        }
        console.log('Map loaded with ' + markers.length + ' markers');
    } catch (e) {
        console.error('Map error:', e);
        const progressEl = document.getElementById('map-progress');
        if (progressEl) progressEl.innerHTML = 'Failed: ' + esc(e.message);
    }

    mapLoaded = true;
}

// ── Init ────────────────────────────────────────────────────────────
document.getElementById('date-input').value = today();
showToday();
</script>
