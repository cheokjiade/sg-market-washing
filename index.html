<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Market Status Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, #e53935, #d32f2f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        header h1 { font-size: 1.8em; margin-bottom: 6px; }
        header p { opacity: 0.9; font-size: 0.95em; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #e53935; color: #e53935; }
        .tab.active { background: #e53935; color: white; border-color: #e53935; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .search-box input, .search-box select {
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-box button {
            padding: 10px 24px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .search-box button:hover { background: #c62828; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #e53935;
        }
        .card.cleaning { border-left-color: #fb8c00; }
        .card.other_works { border-left-color: #7b1fa2; }
        .card h3 { font-size: 1.1em; margin-bottom: 8px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        .badge.cleaning { background: #fb8c00; }
        .badge.other_works { background: #7b1fa2; }
        .date-range { color: #666; font-size: 0.9em; margin-top: 4px; }
        .remarks { color: #888; font-size: 0.85em; margin-top: 4px; font-style: italic; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 30px; color: #666; }
        .error { text-align: center; padding: 30px; color: #c62828; }
        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.85em;
        }
        footer a { color: #e53935; text-decoration: none; }
        #map { height: 500px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            line-height: 1.8;
            font-size: 0.9em;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SG Market Status Checker</h1>
            <p>Check which Singapore hawker centres &amp; markets are closed for washing or renovation</p>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('today', this)">Closed Today</div>
            <div class="tab" onclick="switchTab('upcoming', this)">Upcoming Closures</div>
            <div class="tab" onclick="switchTab('search', this)">Search Market</div>
            <div class="tab" onclick="switchTab('date', this)">Check Date</div>
            <div class="tab" onclick="switchTab('map', this)">Map View</div>
        </div>

        <div id="panel-today" class="panel">
            <div id="today-results" class="loading">Loading...</div>
        </div>

        <div id="panel-upcoming" class="panel" style="display:none">
            <div class="search-box">
                <label>Days ahead: </label>
                <select id="upcoming-days" onchange="showUpcoming()">
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30" selected>30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                </select>
            </div>
            <div id="upcoming-results" class="loading">Loading...</div>
        </div>

        <div id="panel-search" class="panel" style="display:none">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter market or hawker centre name..."
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">Search</button>
            </div>
            <div id="search-results"></div>
        </div>

        <div id="panel-date" class="panel" style="display:none">
            <div class="search-box">
                <input type="date" id="date-input">
                <button onclick="checkDate()">Check</button>
            </div>
            <div id="date-results"></div>
        </div>

        <div id="panel-map" class="panel" style="display:none">
            <div id="map"></div>
        </div>

        <footer>
            Data from <a href="https://data.gov.sg" target="_blank">data.gov.sg</a> (NEA)
        </footer>
    </div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const CLOSURE_DATASET = 'd_bda4baa634dd1cc7a6c7cad5f19e2d68';
const GEOJSON_DATASET = 'd_4a086da0a5553be1d89383cd90d07ecd';
const DS_URL = 'https://data.gov.sg/api/action/datastore_search';
const POLL_URL = 'https://api-open.data.gov.sg/v1/public/api/datasets/{id}/poll-download';

// ── Data cache ──────────────────────────────────────────────────────
let closureCache = null;
let geojsonCache = null;

// ── Date helpers ────────────────────────────────────────────────────
function today() {
    return new Date().toISOString().slice(0, 10);
}

function parseDate(s) {
    if (!s) return null;
    // Try YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
}

function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

// ── Fetch closure data (paginated) ──────────────────────────────────
async function fetchAllClosures() {
    if (closureCache) return closureCache;
    let all = [], offset = 0, total = Infinity;
    while (offset < total) {
        const url = `${DS_URL}?resource_id=${CLOSURE_DATASET}&limit=500&offset=${offset}`;
        const res = await fetch(url);
        const json = await res.json();
        const result = json.result || {};
        total = result.total || 0;
        all = all.concat(result.records || []);
        offset += 500;
    }
    closureCache = all;
    return all;
}

// ── Fetch GeoJSON locations ─────────────────────────────────────────
async function fetchGeoJSON() {
    if (geojsonCache) return geojsonCache;
    const pollUrl = POLL_URL.replace('{id}', GEOJSON_DATASET);
    const res = await fetch(pollUrl);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.errMsg || 'GeoJSON poll failed');
    const geoRes = await fetch(json.data.url);
    geojsonCache = await geoRes.json();
    return geojsonCache;
}

// ── Normalise record keys ───────────────────────────────────────────
function norm(record) {
    const out = {};
    for (const [k, v] of Object.entries(record)) {
        out[k.trim().toLowerCase().replace(/ /g, '_')] = v;
    }
    return out;
}

function field(rec, ...keys) {
    for (const k of keys) if (rec[k]) return rec[k];
    return '';
}

function getName(rec) {
    return field(rec, 'name_of_centre', 'name', 'centre_name', 'hawker_centre') || 'Unknown';
}

// ── Extract all closure periods from a record ───────────────────────
function getClosurePeriods(rec) {
    const periods = [];
    const prefixes = ['cleaning', 'q1_cleaning', 'q2_cleaning', 'q3_cleaning', 'q4_cleaning'];
    for (const p of prefixes) {
        const s = parseDate(field(rec, p + 'startdate', p + '_startdate', p + '_start_date'));
        const e = parseDate(field(rec, p + 'enddate', p + '_enddate', p + '_end_date'));
        if (s && e) periods.push({ type: 'cleaning', start: s, end: e });
    }
    const ws = parseDate(field(rec, 'other_works_startdate', 'other_works_start_date', 'others_startdate'));
    const we = parseDate(field(rec, 'other_works_enddate', 'other_works_end_date', 'others_enddate'));
    if (ws && we) periods.push({ type: 'other_works', start: ws, end: we });
    return periods;
}

// ── Core: get closures on a date ────────────────────────────────────
async function getClosuresOnDate(targetStr) {
    const target = parseDate(targetStr) || new Date();
    const records = await fetchAllClosures();
    const results = [];

    for (const raw of records) {
        const rec = norm(raw);
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= target && target <= p.end) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: field(rec, 'remarks', 'remarks_for_other_works'),
                });
                break; // one match per centre is enough
            }
        }
    }
    return results;
}

// ── Core: upcoming closures ─────────────────────────────────────────
async function getUpcomingClosures(daysAhead) {
    const target = new Date();
    const end = addDays(target, daysAhead);
    const records = await fetchAllClosures();
    const results = [];

    for (const raw of records) {
        const rec = norm(raw);
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= end && p.end >= target) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: field(rec, 'remarks'),
                });
            }
        }
    }
    results.sort((a, b) => a.start_date.localeCompare(b.start_date));
    return results;
}

// ── Core: search by name ────────────────────────────────────────────
async function searchMarket(query) {
    const q = query.toLowerCase();
    const records = await fetchAllClosures();
    const results = [];

    for (const raw of records) {
        const rec = norm(raw);
        const name = getName(rec);
        if (!name.toLowerCase().includes(q)) continue;
        const closures = getClosurePeriods(rec).map(p => ({
            type: p.type,
            start_date: toISO(p.start),
            end_date: toISO(p.end),
        }));
        results.push({ name, closures, remarks: field(rec, 'remarks') });
    }
    return results;
}

// ── Core: map data ──────────────────────────────────────────────────
async function getMapData() {
    const target = new Date();
    const weekAhead = addDays(target, 7);
    const records = await fetchAllClosures();

    // Build closure lookup by lowercase name
    const lookup = {};
    for (const raw of records) {
        const rec = norm(raw);
        const name = getName(rec).trim().toLowerCase();
        for (const p of getClosurePeriods(rec)) {
            const label = p.type === 'cleaning' ? 'Cleaning/Washing' : 'Renovation/Other Works';
            const info = `${label}: ${toISO(p.start)} to ${toISO(p.end)}`;
            if (p.start <= target && target <= p.end) {
                lookup[name] = { status: 'closed', info };
                break;
            } else if (target < p.start && p.start <= weekAhead) {
                if (!lookup[name] || lookup[name].status !== 'closed') {
                    lookup[name] = { status: 'closing_soon', info };
                }
            }
        }
    }

    const geo = await fetchGeoJSON();
    const colourMap = { closed: 'red', closing_soon: 'yellow', open: 'green' };
    const markers = [];

    for (const feat of (geo.features || [])) {
        const props = feat.properties || {};
        const coords = (feat.geometry || {}).coordinates || [];
        if (coords.length < 2) continue;
        const lng = coords[0], lat = coords[1];
        const name = props.NAME || props.name || 'Unknown';
        const nameLower = name.trim().toLowerCase();

        let matched = null;
        for (const [cname, info] of Object.entries(lookup)) {
            if (cname.includes(nameLower) || nameLower.includes(cname)) {
                matched = info;
                break;
            }
        }

        const status = matched ? matched.status : 'open';
        markers.push({
            name,
            lat, lng, status,
            colour: colourMap[status],
            closure_info: matched ? matched.info : '',
            address: props.ADDRESSSTREETNAME || '',
        });
    }
    return markers;
}

// ── UI rendering ────────────────────────────────────────────────────
function renderClosures(closures, containerId) {
    const el = document.getElementById(containerId);
    if (!closures.length) {
        el.innerHTML = '<div class="empty">No closures found.</div>';
        return;
    }
    el.innerHTML = closures.map(c => {
        const typeLabel = c.closure_type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
        return `<div class="card ${c.closure_type}">
            <h3>${esc(c.name)}</h3>
            <span class="badge ${c.closure_type}">${typeLabel}</span>
            <div class="date-range">${c.start_date} to ${c.end_date}</div>
            ${c.remarks ? '<div class="remarks">' + esc(c.remarks) + '</div>' : ''}
        </div>`;
    }).join('');
}

function renderSearchResults(results, containerId) {
    const el = document.getElementById(containerId);
    if (!results.length) {
        el.innerHTML = '<div class="empty">No markets found.</div>';
        return;
    }
    el.innerHTML = results.map(r => {
        const closureHtml = r.closures.length
            ? r.closures.map(c => {
                const label = c.type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
                return `<div style="margin-top:6px"><span class="badge ${c.type}">${label}</span>
                        <span class="date-range">${c.start_date} to ${c.end_date}</span></div>`;
            }).join('')
            : '<div style="margin-top:6px;color:#999">No scheduled closures found.</div>';
        return `<div class="card">
            <h3>${esc(r.name)}</h3>
            ${r.remarks ? '<div class="remarks">' + esc(r.remarks) + '</div>' : ''}
            ${closureHtml}
        </div>`;
    }).join('');
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ── Tab switching ───────────────────────────────────────────────────
function switchTab(tab, tabEl) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    tabEl.classList.add('active');
    document.getElementById('panel-' + tab).style.display = 'block';

    if (tab === 'today') showToday();
    if (tab === 'upcoming') showUpcoming();
    if (tab === 'map') showMap();
}

// ── Tab actions ─────────────────────────────────────────────────────
async function showToday() {
    const el = document.getElementById('today-results');
    el.innerHTML = '<div class="loading">Loading...</div>';
    try {
        const closures = await getClosuresOnDate(today());
        renderClosures(closures, 'today-results');
    } catch (e) {
        el.innerHTML = '<div class="error">Failed to load data. ' + esc(e.message) + '</div>';
    }
}

async function showUpcoming() {
    const el = document.getElementById('upcoming-results');
    el.innerHTML = '<div class="loading">Loading...</div>';
    try {
        const days = parseInt(document.getElementById('upcoming-days').value);
        const closures = await getUpcomingClosures(days);
        renderClosures(closures, 'upcoming-results');
    } catch (e) {
        el.innerHTML = '<div class="error">Failed to load data. ' + esc(e.message) + '</div>';
    }
}

async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    const el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading">Searching...</div>';
    try {
        const results = await searchMarket(q);
        renderSearchResults(results, 'search-results');
    } catch (e) {
        el.innerHTML = '<div class="error">Search failed. ' + esc(e.message) + '</div>';
    }
}

async function checkDate() {
    const d = document.getElementById('date-input').value;
    if (!d) return;
    const el = document.getElementById('date-results');
    el.innerHTML = '<div class="loading">Loading...</div>';
    try {
        const closures = await getClosuresOnDate(d);
        renderClosures(closures, 'date-results');
    } catch (e) {
        el.innerHTML = '<div class="error">Failed to load data. ' + esc(e.message) + '</div>';
    }
}

// ── Map ─────────────────────────────────────────────────────────────
let mapInstance = null;
let mapLoaded = false;

async function showMap() {
    if (mapLoaded) {
        mapInstance.invalidateSize();
        return;
    }

    mapInstance = L.map('map').setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(mapInstance);

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML =
            '<strong>Status</strong><br>' +
            '<span class="legend-dot" style="background:#d32f2f"></span> Closed today<br>' +
            '<span class="legend-dot" style="background:#f9a825"></span> Closing within 7 days<br>' +
            '<span class="legend-dot" style="background:#388e3c"></span> Open';
        return div;
    };
    legend.addTo(mapInstance);

    const colourHex = { red: '#d32f2f', yellow: '#f9a825', green: '#388e3c' };

    try {
        const markers = await getMapData();
        for (const m of markers) {
            const colour = colourHex[m.colour] || '#388e3c';
            const circle = L.circleMarker([m.lat, m.lng], {
                radius: 8,
                fillColor: colour,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9,
            }).addTo(mapInstance);

            let popup = '<strong>' + esc(m.name) + '</strong>';
            if (m.address) popup += '<br>' + esc(m.address);
            if (m.status === 'closed') {
                popup += '<br><span style="color:#d32f2f;font-weight:600">CLOSED</span>';
            } else if (m.status === 'closing_soon') {
                popup += '<br><span style="color:#f9a825;font-weight:600">CLOSING SOON</span>';
            } else {
                popup += '<br><span style="color:#388e3c;font-weight:600">OPEN</span>';
            }
            if (m.closure_info) popup += '<br><em>' + esc(m.closure_info) + '</em>';
            circle.bindPopup(popup);
        }
    } catch (e) {
        document.getElementById('map').innerHTML =
            '<div class="error" style="padding-top:200px">Failed to load map data. ' + esc(e.message) + '</div>';
        return;
    }

    mapLoaded = true;
}

// ── Init ────────────────────────────────────────────────────────────
document.getElementById('date-input').value = today();
showToday();
</script>
</body>
</html>
