<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Market Status Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, #e53935, #d32f2f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        header h1 { font-size: 1.8em; margin-bottom: 6px; }
        header p { opacity: 0.9; font-size: 0.95em; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #e53935; color: #e53935; }
        .tab.active { background: #e53935; color: white; border-color: #e53935; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .search-box input, .search-box select {
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-box button {
            padding: 10px 24px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .search-box button:hover { background: #c62828; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #e53935;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .card.cleaning { border-left-color: #fb8c00; }
        .card.other_works { border-left-color: #7b1fa2; }
        .card-photo {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #eee;
        }
        .card-body { flex: 1; min-width: 0; }
        .card h3 { font-size: 1.1em; margin-bottom: 8px; }
        .card-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .card-title-row h3 { flex: 1; min-width: 0; }
        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            line-height: 1;
            color: #ccc;
            flex-shrink: 0;
            transition: color 0.15s, transform 0.15s;
        }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.active { color: #e53935; }
        .fav-count {
            background: #e53935;
            color: white;
            font-size: 0.65em;
            padding: 1px 5px;
            border-radius: 10px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        .badge.cleaning { background: #fb8c00; }
        .badge.other_works { background: #7b1fa2; }
        .date-range { color: #666; font-size: 0.9em; margin-top: 4px; }
        .remarks { color: #888; font-size: 0.85em; margin-top: 4px; font-style: italic; }
        .day-section { margin-bottom: 20px; }
        .day-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1em;
            font-weight: 700;
            padding: 10px 4px 8px;
            border-bottom: 2px solid #e53935;
            margin-bottom: 10px;
        }
        .day-section-count {
            font-size: 0.75em;
            font-weight: 500;
            color: #999;
        }
        .empty { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 30px; color: #666; }
        .error { text-align: center; padding: 30px; color: #c62828; }
        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.85em;
        }
        footer a { color: #e53935; text-decoration: none; }
        #map { height: 500px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            line-height: 1.8;
            font-size: 0.9em;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        /* Calendar */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .cal-header h2 { font-size: 1.2em; }
        .cal-nav {
            background: none;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }
        .cal-nav:hover { border-color: #e53935; color: #e53935; }
        .cal-body {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 12px;
            overflow: hidden;
        }
        .cal-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
        }
        .cal-dow {
            text-align: center;
            font-size: 0.8em;
            font-weight: 600;
            color: #999;
            padding: 6px 0 10px;
        }
        .cal-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: auto;
            border-top: 1px solid #eee;
        }
        .cal-day {
            border-right: 1px solid #eee;
            padding: 4px;
            min-height: 28px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cal-day:last-child { border-right: none; }
        .cal-day:hover { background: #fafafa; }
        .cal-day.today .cal-day-num {
            background: #e53935;
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cal-day.other-month { opacity: 0.35; }
        .cal-day-num { font-weight: 600; font-size: 0.85em; padding: 2px 4px; }
        .cal-event-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            padding: 0 0 2px;
        }
        .cal-event-bar {
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.72em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
            line-height: 1.6;
            margin: 0 2px 1px;
            cursor: pointer;
        }
        .cal-event-bar.cleaning { background: #fb8c00; }
        .cal-event-bar.other_works { background: #7b1fa2; }
        .cal-event-bar.cont-left { border-radius: 0 4px 4px 0; margin-left: 0; }
        .cal-event-bar.cont-right { border-radius: 4px 0 0 4px; margin-right: 0; }
        .cal-event-bar.cont-both { border-radius: 0; margin-left: 0; margin-right: 0; }
        .cal-more-btn {
            grid-column: 1 / -1;
            font-size: 0.72em;
            color: #e53935;
            cursor: pointer;
            padding: 0 6px 2px;
            font-weight: 600;
        }
        .cal-more-btn:hover { text-decoration: underline; }
        /* Popup overlay */
        .cal-popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cal-popup {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
        }
        .cal-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e53935;
        }
        .cal-popup-header h3 { font-size: 1.05em; }
        .cal-popup-close {
            background: none;
            border: none;
            font-size: 1.4em;
            cursor: pointer;
            color: #999;
            padding: 0 4px;
        }
        .cal-popup-close:hover { color: #333; }
        .cal-popup .card { box-shadow: none; border: 1px solid #eee; }
        .cal-detail { margin-top: 16px; }
        .cal-detail-header {
            background: white;
            padding: 14px 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: 600;
            border-bottom: 2px solid #e53935;
        }
        /* ── Mobile responsive ─────────────────────────── */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            header { padding: 20px 14px; border-radius: 10px; margin-bottom: 16px; }
            header h1 { font-size: 1.4em; }
            header p { font-size: 0.85em; }
            .tabs { gap: 6px; margin-bottom: 14px; }
            .tab { padding: 8px 14px; font-size: 0.85em; border-radius: 6px; }
            .search-box { padding: 14px; border-radius: 10px; }
            .card { padding: 14px; gap: 12px; border-radius: 10px; }
            .card-photo { width: 64px; height: 64px; border-radius: 6px; }
            .card h3 { font-size: 1em; }
            .badge { font-size: 0.72em; padding: 2px 8px; }
            .date-range { font-size: 0.82em; }
            .cal-header { padding: 10px 14px; border-radius: 10px; }
            .cal-header h2 { font-size: 1.05em; }
            .cal-nav { padding: 5px 10px; font-size: 0.9em; }
            .cal-body { padding: 8px; border-radius: 10px; }
            .cal-day { min-height: 24px; padding: 2px; }
            .cal-day-num { font-size: 0.78em; padding: 1px 2px; }
            .cal-day.today .cal-day-num { width: 22px; height: 22px; }
            .cal-event-bar { font-size: 0.6em; padding: 1px 3px; margin: 0 1px 1px; }
            .cal-more-btn { font-size: 0.6em; }
            .cal-popup { padding: 16px; max-height: 80vh; }
            .cal-popup-header h3 { font-size: 0.95em; }
            .cal-popup .card { padding: 12px; }
            #map { height: 400px; border-radius: 10px; }
            .day-section-header { font-size: 1em; }
        }
        @media (max-width: 480px) {
            .container { padding: 8px; }
            header { padding: 16px 10px; margin-bottom: 12px; }
            header h1 { font-size: 1.2em; }
            .tabs { gap: 4px; }
            .tab { padding: 7px 10px; font-size: 0.8em; }
            .card { padding: 10px; gap: 10px; flex-direction: column; }
            .card-photo { width: 100%; height: 140px; border-radius: 8px; }
            .search-box { padding: 10px; }
            .search-box input, .search-box select { padding: 8px 10px; font-size: 0.9em; }
            .cal-dow { font-size: 0.65em; padding: 4px 0; }
            .cal-day-num { font-size: 0.7em; }
            .cal-event-bar { font-size: 0.5em; padding: 0 2px; line-height: 1.4; }
            .cal-popup { width: 95%; padding: 12px; }
            .cal-popup .card { flex-direction: column; }
            .cal-popup .card-photo { width: 100%; height: 120px; }
            #map { height: 300px; }
            .legend { font-size: 0.78em; padding: 8px 10px; }
        }
        @media (max-width: 360px) {
            header h1 { font-size: 1.05em; }
            .tab { padding: 6px 8px; font-size: 0.75em; }
            .cal-event-bar { display: none; }
            .cal-day { min-height: 32px; }
            .cal-more-btn { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SG Market Status Checker</h1>
            <p>Check which Singapore hawker centres &amp; markets are closed for washing or renovation</p>
        </header>

        <div class="tabs">
            <div class="tab" id="fav-tab" onclick="switchTab('fav', this)">Favourites</div>
            <div class="tab" onclick="switchTab('today', this)">Closed Today</div>
            <div class="tab" onclick="switchTab('upcoming', this)">Upcoming Closures</div>
            <div class="tab" onclick="switchTab('search', this)">Search Market</div>
            <div class="tab" onclick="switchTab('date', this)">Calendar</div>
            <div class="tab" onclick="switchTab('map', this)">Map View</div>
        </div>

        <div id="panel-fav" class="panel" style="display:none">
            <div id="fav-results"></div>
        </div>

        <div id="panel-today" class="panel" style="display:none">
            <div id="today-results" class="loading">Loading...</div>
        </div>

        <div id="panel-upcoming" class="panel" style="display:none">
            <div class="search-box">
                <label>Days ahead: </label>
                <select id="upcoming-days" onchange="showUpcoming()">
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30" selected>30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                </select>
            </div>
            <div id="upcoming-results" class="loading">Loading...</div>
        </div>

        <div id="panel-search" class="panel" style="display:none">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Start typing a market or hawker centre name..."
                       oninput="debouncedSearch()">
            </div>
            <div id="search-results"></div>
        </div>

        <div id="panel-date" class="panel" style="display:none">
            <div class="cal-header">
                <button class="cal-nav" onclick="calNav(-1)">&larr; Prev</button>
                <h2 id="cal-title"></h2>
                <button class="cal-nav" onclick="calNav(1)">Next &rarr;</button>
            </div>
            <div class="cal-body" id="cal-body"></div>
            <div class="cal-detail" id="cal-detail"></div>
        </div>

        <div id="panel-map" class="panel" style="display:none">
            <div id="map"></div>
        </div>

        <footer>
            Data from <a href="https://data.gov.sg" target="_blank">data.gov.sg</a> (NEA)
        </footer>
    </div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const CLOSURE_DATASET = 'd_bda4baa634dd1cc7a6c7cad5f19e2d68';
const DS_URL = 'https://data.gov.sg/api/action/datastore_search';

// ── Data cache ──────────────────────────────────────────────────────
let closureCache = null;

// ── Date helpers ────────────────────────────────────────────────────
function today() {
    return new Date().toISOString().slice(0, 10);
}

function parseDate(s) {
    if (!s || typeof s !== 'string') return null;
    s = s.trim();
    if (s === 'NA' || s === 'nil' || s === 'TBC') return null;
    // YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    // D/M/YYYY or DD/MM/YYYY (with / or -)
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
}

function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

// ── Fetch closure data (paginated, with JSONP fallback) ─────────────
function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cb = '_cb' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        window[cb] = function (data) {
            delete window[cb];
            document.head.removeChild(script);
            resolve(data);
        };
        script.onerror = function () {
            delete window[cb];
            document.head.removeChild(script);
            reject(new Error('JSONP request failed'));
        };
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
        document.head.appendChild(script);
    });
}

async function fetchPage(offset) {
    const url = `${DS_URL}?resource_id=${CLOSURE_DATASET}&limit=500&offset=${offset}`;
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    } catch (e) {
        console.log('fetch failed, trying JSONP...', e.message);
        return await jsonp(url);
    }
}

async function fetchAllClosures() {
    if (closureCache) return closureCache;

    // Try cached data first (from GitHub Actions daily fetch)
    try {
        const cached = await fetch('data/closures.json');
        if (cached.ok) {
            const json = await cached.json();
            if (json.records && json.records.length > 0) {
                console.log('Loaded ' + json.records.length + ' records from cache (fetched: ' + json.fetched_at + ')');
                console.log('Column names:', Object.keys(json.records[0]));
                closureCache = json.records;
                return closureCache;
            }
        }
    } catch (e) {
        console.log('Cache not available, falling back to live API...', e.message);
    }

    // Fallback: fetch directly from data.gov.sg API
    let all = [], offset = 0, total = Infinity;
    while (offset < total) {
        const json = await fetchPage(offset);
        const result = json.result || {};
        total = result.total || 0;
        const records = result.records || [];
        all = all.concat(records);
        offset += 500;
        if (records.length === 0) break;
    }
    if (all.length > 0) {
        console.log('Loaded ' + all.length + ' closure records from live API');
        console.log('Column names:', Object.keys(all[0]));
    }
    closureCache = all;
    return all;
}

// ── Field access helpers ────────────────────────────────────────────
// Use the exact column names from the dataset:
//   name, q1_cleaningstartdate, q1_cleaningenddate, remarks_q1,
//   q2_cleaningstartdate, q2_cleaningenddate, remarks_q2, ...
//   q4_cleaningstartdate, q4_cleaningenddate, remarks_q4,
//   other_works_startdate, other_works_enddate, remarks_other_works,
//   latitude_hc, longitude_hc, address_myenv

function getName(rec) {
    return rec.name || rec.Name || rec.name_of_centre || 'Unknown';
}

function getClosurePeriods(rec) {
    const periods = [];
    for (let q = 1; q <= 4; q++) {
        const s = parseDate(rec[`q${q}_cleaningstartdate`]);
        const e = parseDate(rec[`q${q}_cleaningenddate`]);
        if (s && e) periods.push({ type: 'cleaning', start: s, end: e, remarks: rec[`remarks_q${q}`] || '' });
    }
    const ws = parseDate(rec.other_works_startdate);
    const we = parseDate(rec.other_works_enddate);
    if (ws && we) periods.push({ type: 'other_works', start: ws, end: we, remarks: rec.remarks_other_works || '' });
    return periods;
}

function getPhoto(rec) {
    const url = rec.photourl || rec.photo_url || '';
    if (!url || url === 'nil' || url === 'NA') return '';
    // Ensure https
    return url.replace(/^http:/, 'https:');
}

function getLatLng(rec) {
    const lat = parseFloat(rec.latitude_hc);
    const lng = parseFloat(rec.longitude_hc);
    if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) return { lat, lng };
    return null;
}

// ── Core: get closures on a date ────────────────────────────────────
async function getClosuresOnDate(targetStr) {
    const target = parseDate(targetStr) || new Date();
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= target && target <= p.end) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: p.remarks,
                    photourl: getPhoto(rec),
                });
                break;
            }
        }
    }
    return results;
}

// ── Core: upcoming closures ─────────────────────────────────────────
async function getUpcomingClosures(daysAhead) {
    const target = new Date();
    const end = addDays(target, daysAhead);
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= end && p.end >= target) {
                results.push({
                    name,
                    closure_type: p.type,
                    start_date: toISO(p.start),
                    end_date: toISO(p.end),
                    remarks: p.remarks,
                    photourl: getPhoto(rec),
                });
            }
        }
    }
    results.sort((a, b) => a.start_date.localeCompare(b.start_date));
    return results;
}

// ── Core: search by name ────────────────────────────────────────────
async function searchMarket(query) {
    const q = query.toLowerCase();
    const records = await fetchAllClosures();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        if (!name.toLowerCase().includes(q)) continue;
        const closures = getClosurePeriods(rec).map(p => ({
            type: p.type,
            start_date: toISO(p.start),
            end_date: toISO(p.end),
        }));
        results.push({ name, closures, remarks: rec.remarks_other_works || '', photourl: getPhoto(rec) });
    }
    return results;
}

// ── Core: map data (uses latitude_hc / longitude_hc from dataset) ───
async function getMapData() {
    const target = new Date();
    const weekAhead = addDays(target, 7);
    const records = await fetchAllClosures();

    const colourMap = { closed: 'red', closing_soon: 'yellow', open: 'green' };
    const markers = [];

    for (const rec of records) {
        const name = getName(rec);
        const loc = getLatLng(rec);
        if (!loc) continue;

        let status = 'open', closure_info = '';
        for (const p of getClosurePeriods(rec)) {
            const label = p.type === 'cleaning' ? 'Cleaning/Washing' : 'Renovation/Other Works';
            const info = `${label}: ${toISO(p.start)} to ${toISO(p.end)}`;
            if (p.start <= target && target <= p.end) {
                status = 'closed'; closure_info = info; break;
            } else if (target < p.start && p.start <= weekAhead && status !== 'closed') {
                status = 'closing_soon'; closure_info = info;
            }
        }

        markers.push({
            name, lat: loc.lat, lng: loc.lng, status,
            colour: colourMap[status], closure_info,
            address: rec.address_myenv || '',
            photourl: getPhoto(rec),
            food_stalls: rec.no_of_food_stalls || '',
            market_stalls: rec.no_of_market_stalls || '',
            google_3d: rec.google_3d_view || '',
        });
    }
    return markers;
}

// ── Favourites (localStorage) ────────────────────────────────────────
const FAV_KEY = 'sg_market_favourites';

function getFavourites() {
    try {
        return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
    } catch { return []; }
}

function saveFavourites(favs) {
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    updateFavBadge();
}

function isFav(name) {
    return getFavourites().includes(name);
}

function toggleFav(name) {
    const favs = getFavourites();
    const idx = favs.indexOf(name);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push(name);
    saveFavourites(favs);
    // Update all star buttons with this name
    document.querySelectorAll(`.fav-btn[data-name]`).forEach(btn => {
        if (btn.dataset.name === name) {
            btn.classList.toggle('active', favs.includes(name));
            btn.textContent = favs.includes(name) ? '\u2605' : '\u2606';
        }
    });
}

function updateFavBadge() {
    const tab = document.getElementById('fav-tab');
    const count = getFavourites().length;
    tab.innerHTML = 'Favourites' + (count ? `<span class="fav-count">${count}</span>` : '');
}

function favBtnHtml(name) {
    const fav = isFav(name);
    return `<button class="fav-btn ${fav ? 'active' : ''}" data-name="${esc(name)}" `
        + `onclick="event.stopPropagation();toggleFav('${esc(name).replace(/'/g, "\\'")}')" `
        + `title="${fav ? 'Remove from' : 'Add to'} favourites">${fav ? '\u2605' : '\u2606'}</button>`;
}

async function showFavourites() {
    const el = document.getElementById('fav-results');
    const favs = getFavourites();
    if (!favs.length) {
        el.innerHTML = '<div class="empty">No favourites yet. Tap the star on any market to add it here.</div>';
        return;
    }
    el.innerHTML = '<div class="loading">Loading...</div>';
    const records = await fetchAllClosures();
    const todayDate = new Date();
    const results = [];

    for (const rec of records) {
        const name = getName(rec);
        if (!favs.includes(name)) continue;
        const closures = getClosurePeriods(rec).map(p => ({
            type: p.type,
            start_date: toISO(p.start),
            end_date: toISO(p.end),
        }));
        // Determine current status
        let status = 'open';
        for (const p of getClosurePeriods(rec)) {
            if (p.start <= todayDate && todayDate <= p.end) { status = 'closed'; break; }
        }
        results.push({ name, closures, remarks: rec.remarks_other_works || '', photourl: getPhoto(rec), status });
    }

    if (!results.length) {
        el.innerHTML = '<div class="empty">Your favourited markets were not found in the data.</div>';
        return;
    }

    el.innerHTML = results.map(r => {
        const closureHtml = r.closures.length
            ? r.closures.map(c => {
                const label = c.type === 'cleaning' ? 'Cleaning / Washing' : 'Renovation / Other Works';
                return `<div style="margin-top:6px"><span class="badge ${c.type}">${label}</span>
                        <span class="date-range">${c.start_date} to ${c.end_date}</span></div>`;
            }).join('')
            : '<div style="margin-top:6px;color:#388e3c;font-weight:600">No scheduled closures</div>';
        const photo = r.photourl
            ? `<img class="card-photo" src="${esc(r.photourl)}" alt="${esc(r.name)}" loading="lazy" onerror="this.style.display='none'">`
            : '';
        const statusHtml = r.status === 'closed'
            ? '<span style="color:#d32f2f;font-weight:600;font-size:0.85em"> — CLOSED NOW</span>'
            : '';
        return `<div class="card">

// ── Calendar ─────────────────────────────────────────────────────────
let calYear, calMonth; // 0-indexed month
let calEvents = null;  // cached flat list of closure events
// Per-day lookup built from calEvents
let calDayMap = null;   // Map<"YYYY-MM-DD", [{...}]>

function calInit() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
}
calInit();

function calNav(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
}

async function buildCalEvents() {
    if (calEvents) return calEvents;
    const records = await fetchAllClosures();
    const events = [];
    let id = 0;
    for (const rec of records) {
        const name = getName(rec);
        const photourl = getPhoto(rec);
        for (const p of getClosurePeriods(rec)) {
            events.push({
                id: id++, name, type: p.type,
                start: p.start, end: p.end,
                start_date: toISO(p.start), end_date: toISO(p.end),
                remarks: p.remarks, photourl,
            });
        }
    }
    calEvents = events;

    // Build per-day map
    calDayMap = new Map();
    for (const ev of events) {
        const d = new Date(ev.start);
        while (d <= ev.end) {
            const key = toISO(d);
            if (!calDayMap.has(key)) calDayMap.set(key, []);
            calDayMap.get(key).push(ev);
            d.setDate(d.getDate() + 1);
        }
    }
    return events;
}

// Get all dates for the calendar grid (includes prev/next month padding)
function getCalendarDates() {
    const firstDay = new Date(calYear, calMonth, 1);
    const startDow = firstDay.getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const totalCells = startDow + daysInMonth;
    const rows = Math.ceil(totalCells / 7);
    const totalSlots = rows * 7;

    const dates = [];
    // Start from the first visible date
    const startDate = new Date(calYear, calMonth, 1 - startDow);
    for (let i = 0; i < totalSlots; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        dates.push(d);
    }
    return dates;
}

// Find events that overlap a given week (Sun-Sat)
function getWeekEvents(weekDates, allEvents) {
    const weekStart = weekDates[0];
    const weekEnd = weekDates[6];
    return allEvents.filter(ev => ev.start <= weekEnd && ev.end >= weekStart);
}

// Assign events to lanes within a week, return [{event, colStart(1-based), colEnd(1-based), lane}]
function assignLanes(weekDates, weekEvents) {
    const weekStart = weekDates[0];
    const weekEnd = weekDates[6];
    const placed = [];

    // Sort: longer events first, then by start date
    const sorted = [...weekEvents].sort((a, b) => {
        const durA = a.end - a.start, durB = b.end - b.start;
        if (durB !== durA) return durB - durA;
        return a.start - b.start;
    });

    const lanes = []; // lanes[i] = array of {colStart, colEnd}

    for (const ev of sorted) {
        // Clamp to week boundaries
        const effStart = ev.start < weekStart ? weekStart : ev.start;
        const effEnd = ev.end > weekEnd ? weekEnd : ev.end;

        // Convert to 1-based column indices
        const colStart = Math.round((effStart - weekStart) / 86400000) + 1;
        const colEnd = Math.round((effEnd - weekStart) / 86400000) + 2; // grid-column end is exclusive

        // Find first available lane
        let lane = -1;
        for (let l = 0; l < lanes.length; l++) {
            const conflict = lanes[l].some(seg => seg.colStart < colEnd && seg.colEnd > colStart);
            if (!conflict) { lane = l; break; }
        }
        if (lane === -1) {
            lane = lanes.length;
            lanes.push([]);
        }
        lanes[lane].push({ colStart, colEnd });

        const contLeft = ev.start < weekStart;
        const contRight = ev.end > weekEnd;

        placed.push({ event: ev, colStart, colEnd, lane, contLeft, contRight });
    }
    return placed;
}

const MAX_VISIBLE_LANES = 2;

async function renderCalendar() {
    const titleEl = document.getElementById('cal-title');
    const bodyEl = document.getElementById('cal-body');
    const detailEl = document.getElementById('cal-detail');
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    titleEl.textContent = monthNames[calMonth] + ' ' + calYear;
    bodyEl.innerHTML = '<div class="loading">Loading closures...</div>';
    detailEl.innerHTML = '';

    const allEvents = await buildCalEvents();
    const todayStr = today();
    const dates = getCalendarDates();

    // Day-of-week header
    let html = '<div class="cal-dow-row">';
    const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (const d of dows) html += `<div class="cal-dow">${d}</div>`;
    html += '</div>';

    // Render week by week
    for (let w = 0; w < dates.length; w += 7) {
        const weekDates = dates.slice(w, w + 7);
        const weekEvents = getWeekEvents(weekDates, allEvents);
        const placed = assignLanes(weekDates, weekEvents);

        html += '<div class="cal-week">';

        // Day number cells
        for (let d = 0; d < 7; d++) {
            const dt = weekDates[d];
            const key = toISO(dt);
            const isOther = dt.getMonth() !== calMonth;
            const isTod = key === todayStr;
            const cls = ['cal-day'];
            if (isTod) cls.push('today');
            if (isOther) cls.push('other-month');
            html += `<div class="${cls.join(' ')}" onclick="calSelectDay('${key}')" style="grid-column:${d+1};grid-row:1">`;
            html += `<div class="cal-day-num">${dt.getDate()}</div>`;
            html += '</div>';
        }

        // Event bars (lanes)
        const visiblePlaced = placed.filter(p => p.lane < MAX_VISIBLE_LANES);
        const hiddenPlaced = placed.filter(p => p.lane >= MAX_VISIBLE_LANES);

        for (const p of visiblePlaced) {
            const ev = p.event;
            let cls = 'cal-event-bar ' + ev.type;
            if (p.contLeft && p.contRight) cls += ' cont-both';
            else if (p.contLeft) cls += ' cont-left';
            else if (p.contRight) cls += ' cont-right';
            html += `<div class="${cls}" style="grid-column:${p.colStart}/${p.colEnd};grid-row:${p.lane + 2}" `
                + `onclick="event.stopPropagation();calShowPopupForEvent(${ev.id})" `
                + `title="${esc(ev.name)} (${ev.start_date} to ${ev.end_date})">`
                + esc(ev.name) + '</div>';
        }

        // "+N more" link if there are hidden events
        if (hiddenPlaced.length > 0) {
            // Find which days have hidden events and show a single "+N more" for the week
            const hiddenIds = new Set(hiddenPlaced.map(p => p.event.id));
            // Show on the first day that has a hidden event
            const firstHiddenCol = Math.min(...hiddenPlaced.map(p => p.colStart));
            const weekStartKey = toISO(weekDates[0]);
            const weekEndKey = toISO(weekDates[6]);
            html += `<div class="cal-more-btn" style="grid-row:${MAX_VISIBLE_LANES + 2}" `
                + `onclick="event.stopPropagation();calShowMorePopup('${weekStartKey}','${weekEndKey}',${JSON.stringify([...hiddenIds])})">`
                + `+${hiddenIds.size} more</div>`;
        }

        html += '</div>'; // .cal-week
    }

    bodyEl.innerHTML = html;
}

function calShowPopupForEvent(eventId) {
    const ev = calEvents.find(e => e.id === eventId);
    if (!ev) return;
    calShowPopup(ev.name, [{
        name: ev.name, closure_type: ev.type,
        start_date: ev.start_date, end_date: ev.end_date,
        remarks: ev.remarks, photourl: ev.photourl,
    }]);
}

function calShowMorePopup(weekStartKey, weekEndKey, hiddenIds) {
    const idSet = new Set(hiddenIds);
    const evs = calEvents.filter(e => idSet.has(e.id));
    const closures = evs.map(e => ({
        name: e.name, closure_type: e.type,
        start_date: e.start_date, end_date: e.end_date,
        remarks: e.remarks, photourl: e.photourl,
    }));
    calShowPopup(closures.length + ' more closure' + (closures.length > 1 ? 's' : ''), closures);
}

function calShowPopup(title, closures) {
    // Remove any existing popup
    const existing = document.querySelector('.cal-popup-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'cal-popup-overlay';
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

    const popup = document.createElement('div');
    popup.className = 'cal-popup';

    let headerHtml = `<div class="cal-popup-header"><h3>${esc(title)}</h3>`
        + `<button class="cal-popup-close" onclick="this.closest('.cal-popup-overlay').remove()">&times;</button></div>`;
    popup.innerHTML = headerHtml + '<div id="cal-popup-list"></div>';
    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    renderClosures(closures, 'cal-popup-list');
}

function calSelectDay(dateKey) {
    const events = calDayMap ? (calDayMap.get(dateKey) || []) : [];
    const d = parseDate(dateKey);
    const dateLabel = d ? d.toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : dateKey;

    if (!events.length) {
        calShowPopup(dateLabel, []);
        // Override empty message
        const el = document.getElementById('cal-popup-list');
        if (el) el.innerHTML = '<div class="empty">No closures on this date.</div>';
        return;
    }

    const closures = events.map(e => ({
        name: e.name, closure_type: e.type,
        start_date: e.start_date, end_date: e.end_date,
        remarks: e.remarks, photourl: e.photourl,
    }));
    calShowPopup(dateLabel + ' — ' + closures.length + ' closure' + (closures.length > 1 ? 's' : ''), closures);
}

// ── Map ─────────────────────────────────────────────────────────────
let mapInstance = null;
let mapLoaded = false;

async function showMap() {
    if (mapLoaded) {
        mapInstance.invalidateSize();
        return;
    }

    const mapEl = document.getElementById('map');
    mapEl.innerHTML = '';

    mapInstance = L.map('map').setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(mapInstance);

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML =
            '<strong>Status</strong><br>' +
            '<span class="legend-dot" style="background:#d32f2f"></span> Closed today<br>' +
            '<span class="legend-dot" style="background:#f9a825"></span> Closing within 7 days<br>' +
            '<span class="legend-dot" style="background:#388e3c"></span> Open';
        return div;
    };
    legend.addTo(mapInstance);

    const colourHex = { red: '#d32f2f', yellow: '#f9a825', green: '#388e3c' };

    try {
        const markers = await getMapData();

        for (const m of markers) {
            const colour = colourHex[m.colour] || '#388e3c';
            const circle = L.circleMarker([m.lat, m.lng], {
                radius: 8,
                fillColor: colour,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9,
            }).addTo(mapInstance);

            let popup = '';
            if (m.photourl) popup += '<img src="' + esc(m.photourl) + '" style="width:200px;height:120px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block" onerror="this.style.display=\'none\'">';
            popup += '<strong>' + esc(m.name) + '</strong>';
            if (m.address) popup += '<br>' + esc(m.address);
            if (m.status === 'closed') {
                popup += '<br><span style="color:#d32f2f;font-weight:600">CLOSED</span>';
            } else if (m.status === 'closing_soon') {
                popup += '<br><span style="color:#f9a825;font-weight:600">CLOSING SOON</span>';
            } else {
                popup += '<br><span style="color:#388e3c;font-weight:600">OPEN</span>';
            }
            if (m.closure_info) popup += '<br><em>' + esc(m.closure_info) + '</em>';
            const stalls = [];
            if (m.food_stalls && m.food_stalls !== 'nil') stalls.push(m.food_stalls + ' food stalls');
            if (m.market_stalls && m.market_stalls !== 'nil') stalls.push(m.market_stalls + ' market stalls');
            if (stalls.length) popup += '<br><span style="color:#555;font-size:0.85em">' + esc(stalls.join(' · ')) + '</span>';
            if (m.google_3d && m.google_3d !== 'nil') popup += '<br><a href="' + esc(m.google_3d) + '" target="_blank" rel="noopener" style="font-size:0.85em">View in Google 3D</a>';
            circle.bindPopup(popup, { maxWidth: 250 });
        }
        console.log('Map loaded with ' + markers.length + ' markers');
    } catch (e) {
        console.error('Map error:', e);
    }

    mapLoaded = true;
}

// ── Init ────────────────────────────────────────────────────────────
updateFavBadge();
if (getFavourites().length > 0) {
    // Show favourites tab by default if user has favourites
    const favTab = document.getElementById('fav-tab');
    favTab.classList.add('active');
    document.getElementById('panel-fav').style.display = 'block';
    document.getElementById('panel-today').style.display = 'none';
    showFavourites();
} else {
    document.querySelector('.tab[onclick*="today"]').classList.add('active');
    document.getElementById('panel-today').style.display = 'block';
    showToday();
}
</script>
